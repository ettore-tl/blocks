<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blocks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Manrope', sans-serif; }
  .font-opensans { font-family: 'Open Sans', sans-serif; }
  #phone {
    position: relative;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* old Edge/IE */
  }
  #phone::-webkit-scrollbar { display: none; width: 0; height: 0; } /* Chrome/Safari */

  /* --- iPhone mockup shell — pure CSS, purely decorative chrome around the
     390x844 screen; none of it affects the app's own layout/logic. --- */
  .iphone-mockup {
    position: relative;
    box-sizing: border-box;
    width: 424px;
    height: 878px;
    padding: 17px;
    background: linear-gradient(160deg, #5b5c60 0%, #29292b 45%, #0a0a0b 100%);
    border-radius: 60px;
    box-shadow:
      0 45px 90px -25px rgba(0, 0, 0, 0.5),
      0 14px 30px rgba(0, 0, 0, 0.25),
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.15),
      inset 0 0 4px 2px rgba(0, 0, 0, 0.5);
  }
  .iphone-island {
    position: absolute;
    top: 23px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 26px;
    background: #000;
    border-radius: 14px;
    z-index: 50;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  .iphone-btn {
    position: absolute;
    background: linear-gradient(90deg, #48484a, #1c1c1e);
    box-shadow: -1px 0 1px rgba(0, 0, 0, 0.4);
  }
  .iphone-btn-mute     { left: 0px;  top: 121px; width: 3px; height: 32px; border-radius: 2px 0 0 2px; }
  .iphone-btn-vol-up   { left: 0px;  top: 172px; width: 3px; height: 58px; border-radius: 2px 0 0 2px; }
  .iphone-btn-vol-down { left: 0px;  top: 240px; width: 3px; height: 58px; border-radius: 2px 0 0 2px; }
  .iphone-btn-power    { right: 0px; top: 195px; width: 3px; height: 92px; border-radius: 0 2px 2px 0;
                          background: linear-gradient(270deg, #48484a, #1c1c1e); box-shadow: 1px 0 1px rgba(0, 0, 0, 0.4); }

  /* --- Layout modes. The mobile experience (#mobileStage) is completely
     untouched — same iPhone mockup, same #phone, same everything. The
     desktop experience (#desktopStage) is a separate, independent checkout
     page with its own markup and state; the two don't share any DOM, only
     the read-only BANKS data and a couple of rendering helpers. --- */
  #stage.mode-mobile #desktopStage { display: none; }
  #stage.mode-mobile #mobileStage { display: flex; }
  #stage.mode-desktop #mobileStage { display: none; }
  #stage.mode-desktop #desktopStage { display: block; width: 100%; }
  /* The checkout page can be taller than the viewport — top-align it
     instead of the mobile mode's vertical centering, so it scrolls
     naturally from the top like a real page rather than clipping. */
  #stage.mode-desktop { align-items: flex-start; }
</style>
</head>
<body id="pageBody" class="min-h-screen bg-[#eef0f3] flex flex-col items-center gap-5 py-10">

  <div class="flex items-center gap-4">
    <p class="text-xs font-semibold tracking-wide text-[#646477] uppercase">Blocks · interactive demo</p>
    <button onclick="restartAll()" class="text-xs font-semibold text-[#4d3bd8] flex items-center gap-1 hover:text-[#3a2ca8] transition">
      <i class="fa-solid fa-rotate-left"></i> Restart
    </button>
    <button id="viewModeToggle" onclick="toggleViewMode()" class="text-xs font-semibold text-[#4d3bd8] flex items-center gap-1 hover:text-[#3a2ca8] transition">
      <i class="fa-solid fa-desktop"></i> <span id="viewModeLabel">Switch to desktop</span>
    </button>
  </div>

  <div id="stage" class="mode-mobile flex-1 w-full flex items-center justify-center">
    <div id="mobileStage" class="iphone-mockup shrink-0">
      <div class="iphone-island"></div>
      <span class="iphone-btn iphone-btn-mute"></span>
      <span class="iphone-btn iphone-btn-vol-up"></span>
      <span class="iphone-btn iphone-btn-vol-down"></span>
      <span class="iphone-btn iphone-btn-power"></span>
      <div id="phone" class="w-full h-full rounded-[42px] overflow-y-auto overflow-x-hidden bg-white"></div>
    </div>

    <div id="desktopStage"></div>
  </div>

  <button id="tunerToggle" onclick="toggleTuner()" class="hidden fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-[#1f1f25] text-white shadow-xl flex items-center justify-center text-2xl hover:scale-105 transition" title="Animation tuner">
    <i class="fa-solid fa-sliders"></i>
  </button>
  <div id="tunerPanel" class="hidden fixed bottom-24 right-6 z-50 w-[300px] max-h-[75vh] overflow-y-auto bg-white rounded-2xl shadow-2xl border border-[#d0d0d7] p-4"></div>

<script>
// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------
// `color` is each bank's real brand primary — used to skin their dedicated
// login and PIS-authorisation screens (background, Confirm button, Cancel
// text) so each bank in the flow feels like its own app, not a reskinned
// Monzo screen.
const BANKS = {
  barclays:   { name: 'Barclays',     color: '#00AEEF', base: 'grid-barclays-base.svg',   overlays: [{ src: 'grid-barclays-overlay.svg', inset: '19.41% 21.18% 19.26% 21.32%' }] },
  hsbc:       { name: 'HSBC',         color: '#DB0011', base: 'grid-hsbc-base.svg',       overlays: [{ src: 'grid-hsbc-overlay.svg', inset: '33.82% 17.65%' }] },
  lloyds:     { name: 'Lloyds',       color: '#006A4D', base: 'grid-lloyds.svg',          overlays: [] },
  natwest:    { name: 'NatWest',      color: '#5A2887', base: 'grid-natwest-base.svg',    overlays: [{ src: 'grid-natwest-overlay.svg', inset: '23.53% 19.63% 23.68% 19.52%' }] },
  nationwide: { name: 'Nationwide',   color: '#002D72', base: 'grid-nationwide.svg',      overlays: [] },
  santander:  { name: 'Santander',    color: '#EC0000', base: 'grid-santander-base.svg',  overlays: [{ src: 'grid-santander-overlay.svg', inset: '18.82% 17.35%' }] },
  monzo:      { name: 'Monzo',        color: '#112231', base: 'grid-monzo-base.svg',      overlays: [{ src: 'grid-monzo-overlay.svg', inset: '23.64% 19.41% 21.28% 19.41%' }] },
  tsb:        { name: 'TSB',          color: '#0075C9', base: 'grid-tesco-base.svg',      overlays: [
                  { src: 'grid-tsb-v1.svg', inset: '36.62% 12.65% 36.62% 62.35%' },
                  { src: 'grid-tsb-v2.svg', inset: '36.76% 37.65% 36.47% 39.12%' },
                  { src: 'grid-tsb-v3.svg', inset: '36.76% 60.74% 36.47% 14.26%' },
                  { src: 'grid-tsb-g1.svg', inset: '43.38% 58.82% 43.09% 37.35%' },
                  { src: 'grid-tsb-v4.svg', inset: '43.38% 35.74% 43.09% 60.44%' },
                  { src: 'grid-tsb-g2.svg', inset: '42.94% 67.35% 42.65% 22.21%' },
                  { src: 'grid-tsb-g3.svg', inset: '42.94% 19.56% 42.65% 69.26%' },
                  { src: 'grid-tsb-v5.svg', inset: '42.5% 43.48% 42.65% 44.41%' } ] },
  virgin:     { name: 'Virgin Money', color: '#E00B0B', base: 'grid-virgin-base.svg',     overlays: [
                  { src: 'grid-virgin-v1.svg', inset: '68.02% 65.74% 20.33% 22.04%' },
                  { src: 'grid-virgin-v2.svg', inset: '68.29% 41.91% 20.74% 48.95%' },
                  { src: 'grid-virgin-v3.svg', inset: '68.38% 32.06% 20.88% 60.44%' },
                  { src: 'grid-virgin-v4.svg', inset: '68.24% 21.91% 20.88% 68.82%' },
                  { src: 'grid-virgin-v5.svg', inset: '68.09% 52.67% 20.88% 36.18%' },
                  { src: 'grid-virgin-v6.svg', inset: '20.46% 28.7% 35.67% 28.82%' } ] },
  tesco:      { name: 'Tesco',        color: '#00539F', base: 'grid-tesco-base.svg',      overlays: [
                  { src: 'grid-tesco-layer1.svg', inset: '71.18% 26.69% 17.5% 23.75%' },
                  { src: 'grid-tesco-layer2.svg', inset: '17.79% 24.12% 40.74% 25.59%' } ] },
};
const BANK_ORDER = ['barclays','hsbc','lloyds','natwest','nationwide','santander','monzo','tsb','virgin','tesco'];

const STEP_BG = {
  method: '#ffffff', pbb: '#ffffff', bankselect: '#ffffff', review: '#ffffff',
  bankreview: '#f7f7f7', bankauth: '#f7f7f7', success: '#ffffff',
};
// 'login' isn't in the static map above — it's the selected bank's own
// brand color, since that screen is meant to look like that bank's app.
function stepBackground(step) {
  return step === 'login' ? currentBank().color : STEP_BG[step];
}

const state = { step: 'method', selectedMethod: null, selectedBank: null };
let autoTimer = null;
let mountedGroup = null;

// ---------------------------------------------------------------------------
// Animation tuning — every duration/easing below is read live from this
// object (not cached into constants), so the on-page tuner can adjust them
// and have the very next transition pick up the new values immediately.
// ---------------------------------------------------------------------------
const TUNING_DEFAULTS = {
  fadeOut: 70,        // pbb-box content fading out before a swap
  resize: 0,          // invisible height resize between fade-out and fade-in
  fadeIn: 280,        // new pbb-box content fading in once correctly sized
  collapse: 120,      // collapsing to nothing (e.g. Pay by Bank closing)
  screenFadeOut: 100, // whole-screen crossfade: old screen fading out
  screenFadeIn: 0,    // whole-screen crossfade: new screen fading in
  overlaySlide: 350,  // Face ID overlay sliding down on the bank-auth screen
  autoAdvance: 1800,  // auto-advance delay on the login / bank-auth screens
  easeOut: 'ease-out',
  easeIn: 'ease-in',
};
const TUNING = { ...TUNING_DEFAULTS };

function currentBank() { return BANKS[state.selectedBank] || BANKS.monzo; }
function asset(name) { return `assets/${name}`; }
function groupOf(step) {
  if (['method', 'pbb', 'bankselect', 'review'].includes(step)) return 'A';
  if (['bankreview', 'bankauth'].includes(step)) return 'C';
  if (step === 'login') return 'B';
  return 'D';
}

// ---------------------------------------------------------------------------
// Small reusable pieces
// ---------------------------------------------------------------------------
function separator() { return `<div class="h-px w-full bg-[#ececef]"></div>`; }

function radioCircle(selected) {
  return selected
    ? `<div class="w-5 h-5 rounded-full bg-[#f33b92] flex items-center justify-center shrink-0"><i class="fa-solid fa-check text-white text-[10px]"></i></div>`
    : `<div class="w-5 h-5 rounded-full border border-[#9090a2] bg-white shrink-0"></div>`;
}

function bankIconInner(b) {
  let html = `<div class="relative w-full h-full">
      <img src="${asset(b.base)}" class="absolute inset-0 w-full h-full object-cover" />`;
  (b.overlays || []).forEach(o => {
    html += `<div class="absolute" style="inset:${o.inset}"><img src="${asset(o.src)}" class="block w-full h-full" /></div>`;
  });
  html += `</div>`;
  return html;
}

function acceptedBanksStrip() {
  // Single flattened source asset (fanned bank logos + "+") — matches the
  // design exactly, rather than approximating it with separate circles.
  return `<img src="${asset('accepted-banks-strip.svg')}" class="h-6 w-[78px] shrink-0" />`;
}

function hotelCard() {
  return `
    <div class="w-full border border-[#d0d0d7] rounded-xl p-4 flex flex-col gap-4">
      <div class="flex gap-[21px] items-center w-full">
        <div class="w-20 h-20 rounded-[9px] overflow-hidden shrink-0 bg-[#f4f4f6]">
          <img src="${asset('hotel.png')}" class="w-full h-full object-cover object-bottom" />
        </div>
        <div class="flex flex-col gap-1">
          <p class="font-semibold text-base text-[#060606]">Royal cabin Kyoto</p>
          <div class="flex flex-col gap-0.5 text-xs text-[#646477]">
            <div class="flex items-center gap-1"><i class="fa-solid fa-location-dot text-[10px] text-[#060606]"></i><span>Nagyo Ward, Kyoto, Japan</span></div>
            <div class="flex items-center gap-1"><i class="fa-solid fa-star text-[10px] text-[#f33b92]"></i><span>4,8 · 64 reviews</span></div>
          </div>
        </div>
      </div>
      ${separator()}
      <div class="flex justify-between w-full text-sm">
        <div><p class="font-bold text-[#060606]">Dates</p><p class="text-black">5-9 Sept 2026</p></div>
        <div><p class="font-bold text-[#060606]">Guests</p><p class="text-black">2 adults</p></div>
      </div>
      ${separator()}
      <div class="flex justify-between w-full text-sm items-center">
        <p class="font-bold text-[#060606]">Total price</p>
        <p class="text-base text-black">£1,500.00 GBP</p>
      </div>
    </div>`;
}

function pbbHeader() {
  return `
    <div class="flex gap-3 items-center w-full">
      <div class="bg-[#afadff] border border-[#ececef] h-6 w-[35px] rounded shrink-0 flex items-center justify-center">
        <img src="${asset('pbb-mark.svg')}" class="h-3.5 w-3.5" />
      </div>
      <p class="flex-1 font-semibold text-lg text-[#060606]">Pay by Bank</p>
      ${acceptedBanksStrip()}
    </div>`;
}

function pbbBlurb() {
  return `<p class="text-sm leading-5 text-[#060606] w-full"><b>Pay in full</b> <b>now</b> or <b>spread the cost</b> for up to 24 months, securely from your bank app. <span class="text-[#4d3bd8] font-semibold cursor-default">Learn more</span></p>`;
}

function paymentIcon(type) {
  if (type === 'amex') {
    return `<div class="relative w-[29px] h-5 shrink-0">
      <div class="absolute inset-0 rounded-[3px] bg-[#1f72cd] border border-[#d9d9d9]"></div>
      <div class="absolute" style="inset:35% 9% 34% 9%"><img src="${asset('amex.svg')}" class="w-full h-full" /></div>
    </div>`;
  }
  const inset = type === 'visa' ? '35% 17% 32% 13%' : '21% 17% 22% 19%';
  return `<div class="relative w-[29px] h-5 shrink-0">
    <div class="absolute inset-0 rounded-[6px] bg-white border border-[#d0d0d7]"></div>
    <div class="absolute" style="inset:${inset}"><img src="${asset(type + '.svg')}" class="w-full h-full" /></div>
  </div>`;
}

// Card/PayPal are only a real, interactive choice on the very first "method"
// screen (matching Figma: on the pbb/bankselect/review screens their radio
// Card/PayPal are selectable from any group-A step, not just 'method' —
// picking one abandons whatever progress you'd made into the Pay by Bank
// flow and resets it back to its first, unselected state (see selectMethod).
function cardRow() {
  const sel = state.selectedMethod === 'card';
  return `
    <div class="flex items-center gap-3 py-1 w-full cursor-pointer" onclick="selectMethod('card')">
      ${radioCircle(sel)}
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <div class="w-8 h-6 border border-black rounded flex items-center justify-center shrink-0"><i class="fa-solid fa-credit-card text-sm"></i></div>
        <p class="flex-1 font-semibold text-lg text-[#060606]">Card</p>
        <div class="flex gap-[3px] shrink-0">
          ${paymentIcon('visa')}${paymentIcon('mastercard')}${paymentIcon('amex')}
        </div>
      </div>
    </div>`;
}

function paypalRow() {
  const sel = state.selectedMethod === 'paypal';
  return `
    <div class="flex items-center gap-3 py-1 w-full cursor-pointer" onclick="selectMethod('paypal')">
      ${radioCircle(sel)}
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <div class="border border-black rounded px-[7px] py-[4px] shrink-0"><img src="${asset('paypal.svg')}" class="h-4" /></div>
        <p class="flex-1 font-semibold text-lg text-[#060606]">PayPal</p>
      </div>
    </div>`;
}

function bankGridButton(id) {
  const b = BANKS[id];
  const sel = state.selectedBank === id;
  // Rings (box-shadow) instead of `border` — a border consumes layout space
  // via box-sizing:border-box and would shrink the actual 32x32 logo to
  // ~30x30. An inset shadow paints the same visual edge without doing that.
  //
  // A tilt+drop-shadow transform on the icon was tried here to make the
  // selected one "pop", but a rotated/shadowed element inside a container
  // that's also being height-animated produced stray shadow artifacts
  // bleeding into unrelated rows below (Card/PayPal) during the transition
  // — a compositing glitch, not worth it. Back to a plain ring.
  const btnCls = sel
    ? 'shadow-[inset_0_0_0_2px_#4d3bd8] bg-[#f2f1ff]'
    : 'shadow-[inset_0_0_0_1px_#d0d0d7] bg-white hover:shadow-[inset_0_0_0_1px_#4d3bd8] hover:bg-[#f8f8ff]';
  return `
    <button onclick="selectBank('${id}')" class="w-12 h-12 rounded-lg ${btnCls} flex items-center justify-center p-2 transition-colors duration-150">
      <div class="w-8 h-8 rounded-md overflow-hidden bg-white shadow-[inset_0_0_0_1px_#ececef]">${bankIconInner(b)}</div>
    </button>`;
}

// ---------------------------------------------------------------------------
// Group A — method / pbb / bankselect / review (shared shell: logo, hotel
// card, the Pay-by-Bank radio/header/blurb, and the Card/PayPal rows never
// change across these steps, so they're rendered once and never touched
// again. Only #pbbBox (and #pbbButtonRow on the review step) differ per step
// and are the only things that animate.)
// ---------------------------------------------------------------------------
function pbbBoxContent(step) {
  if (step === 'method') return '';

  if (step === 'pbb') {
    return `
      <div class="mt-3 flex flex-col gap-2 w-full">
        <div class="border border-[#d0d0d7] rounded-xl px-4 py-3 flex flex-col gap-2 cursor-pointer hover:bg-[#fafafa]" onclick="goto('bankselect')">
          <div class="flex items-center gap-2 w-full">
            <p class="flex-1 font-bold text-base text-[#060606]">Pay in Full</p>
            <i class="fa-solid fa-chevron-right text-[#4d3bd8] text-sm"></i>
          </div>
          <p class="font-medium text-base text-[#060606]">£1,500.00</p>
        </div>
        <div class="border border-[#d0d0d7] rounded-xl px-4 py-3 flex flex-col gap-2">
          <div class="flex items-center gap-2 w-full">
            <p class="flex-1 font-bold text-base text-[#060606]">Apply for Credit</p>
            <i class="fa-solid fa-chevron-right text-[#4d3bd8] text-sm"></i>
          </div>
          <div class="flex flex-col gap-2 w-full text-sm">
            <div class="flex justify-between items-center"><p class="font-medium text-base text-[#060606]">£76.35 /mo</p><div class="flex gap-1"><span class="bg-[#f4f4f6] rounded-lg px-2 py-0.5 text-xs font-semibold text-[#060606]">20% APR</span><span class="bg-[#e7e6ff] rounded-lg px-2 py-0.5 text-xs font-semibold text-[#060606]">24 Months</span></div></div>
            <div class="flex justify-between items-center"><p class="font-medium text-base text-[#060606]">£138.95 /mo</p><div class="flex gap-1"><span class="bg-[#f4f4f6] rounded-lg px-2 py-0.5 text-xs font-semibold text-[#060606]">20% APR</span><span class="bg-[#e7e6ff] rounded-lg px-2 py-0.5 text-xs font-semibold text-[#060606]">12 Months</span></div></div>
            <div class="flex justify-between items-center"><p class="font-medium text-base text-[#060606]">£500.00 /mo</p><div class="flex gap-1"><span class="bg-[rgba(0,143,102,0.08)] text-[#008f66] rounded-lg px-2 py-0.5 text-xs font-semibold">Free</span><span class="bg-[#e7e6ff] rounded-lg px-2 py-0.5 text-xs font-semibold text-[#060606]">3 Months</span></div></div>
          </div>
          <p class="text-xs text-[#646477]">Example rates use rep. APR. Your rate may vary.</p>
        </div>
      </div>`;
  }

  if (SUBSHELL_STEPS.has(step)) return subShellContent(step);
}

// 'bankselect' and 'review' share one visual shell — a bordered box with a
// back-chevron, a title, the static "Pay in Full / £1,500.00" row, and a
// separator, before the part that's actually unique to each step. Only the
// title and that unique body differ between them, so those are the only two
// things given their own ids to animate independently (see updateSubShell);
// the chevron, the price row, and the separator never re-render at all.
const SUBSHELL_STEPS = new Set(['bankselect', 'review']);

function subShellTitle(step) {
  return step === 'bankselect' ? 'Select your bank' : 'Review';
}

function subShellBackOnclick(step) {
  return step === 'bankselect' ? "goto('pbb')" : 'backToBankSelect()';
}

function subShellBody(step) {
  if (step === 'bankselect') {
    return `
      <div class="flex flex-col gap-4 w-full items-center">
        <div class="grid grid-cols-5 gap-[13px] w-full">
          ${BANK_ORDER.map(id => bankGridButton(id)).join('')}
        </div>
        <p class="mb-2 text-[#4d3bd8] text-sm font-semibold text-center cursor-default select-none">See all banks</p>
      </div>`;
  }
  const b = currentBank();
  return `
    <div class="flex flex-col gap-4 w-full">
      <div class="flex items-center gap-4 w-full">
        <div class="w-12 h-12 rounded-lg shadow-[inset_0_0_0_2px_#4d3bd8] bg-[#afadff26] flex items-center justify-center p-2 shrink-0">
          <div class="w-8 h-8 rounded-md overflow-hidden bg-white shadow-[inset_0_0_0_1px_#ececef]">${bankIconInner(b)}</div>
        </div>
        <p class="flex-1 font-medium text-base text-[#060606]">${b.name}</p>
        <button class="text-[#4d3bd8] text-sm font-semibold shrink-0" onclick="backToBankSelect()">Change</button>
      </div>
      <p class="text-[11px] leading-[18px] text-[#40404c]">By continuing you are permitting TrueLayer to initiate a payment from your bank account. You also agree to its <span class="text-[#4d3bd8] font-semibold underline cursor-default">Terms of Service</span> and <span class="text-[#4d3bd8] font-semibold underline cursor-default">Privacy Policy</span>.</p>
    </div>`;
}

function subShellContent(step) {
  return `
    <div class="mt-3 border border-[#d0d0d7] rounded-xl px-4 py-3 flex flex-col gap-4 w-full">
      <div class="flex items-center gap-2">
        <button id="subBack" onclick="${subShellBackOnclick(step)}" class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-[#f4f4f6] shrink-0"><i class="fa-solid fa-chevron-left text-[#060606]"></i></button>
        <p id="subTitle" class="font-bold text-base text-[#060606] overflow-hidden">${subShellTitle(step)}</p>
      </div>

// Overlapping calls on the same element (e.g. a quick second click before a
// prior swap finished) used to leave stale timers/listeners racing each
// other, which could strand an element mid-height. Every animation below is
// an async function that bumps this per-element generation counter on entry
// and checks it after every await — if a newer call started in the
// meantime, the stale one just stops touching the DOM instead of fighting
// the new one for the final state.
const animGeneration = new WeakMap();
function bumpGeneration(el) {
  const g = (animGeneration.get(el) || 0) + 1;
  animGeneration.set(el, g);
  return g;
}
function isCurrentGeneration(el, g) {
  return animGeneration.get(el) === g;
}

function nextFrame() {
  return new Promise((resolve) => requestAnimationFrame(resolve));
}
function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}
// Resolves on `transitionend` for the given property, or after `timeoutMs`
// regardless — a safety net for whenever the browser doesn't fire the event
// (e.g. the start/end values happened to already match).
function waitForTransition(el, property, timeoutMs) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.removeEventListener('transitionend', onEnd);
      resolve();
    };
    const onEnd = (e) => { if (e.propertyName === property) finish(); };
    el.addEventListener('transitionend', onEnd);
    setTimeout(finish, timeoutMs);
  });
}

function lockHeight(el) {
  el.style.height = el.getBoundingClientRect().height + 'px';
  el.style.overflow = 'hidden';
}

// Setting `transition` and changing the value it targets in the same
// synchronous block can get coalesced by the browser into a single instant
// jump instead of an animation — reading a layout property in between forces
// the style to actually commit first, so the following change is guaranteed
// to animate. This is what made the height resize below jump instead of
// easing smoothly.
function forceReflow(el) {
  void el.offsetHeight;
}

// Closing down to nothing (e.g. Pay by Bank collapsing back to its
// unselected state) doesn't need the fade-out/resize/fade-in sequence built
// for swapping one piece of content for another — there's no new content to
// reveal, so opacity and height can just shrink together in one fast,
// single motion instead of leaving an empty box hanging around mid-shrink.
async function collapseElement(el, duration) {
  const g = bumpGeneration(el);
  const startHeight = el.getBoundingClientRect().height;
  el.style.overflow = 'hidden';
  el.style.height = startHeight + 'px';
  await nextFrame();
  if (!isCurrentGeneration(el, g)) return;
  el.style.transition = `opacity ${duration}ms ${TUNING.easeIn}, height ${duration}ms ${TUNING.easeIn}`;
  forceReflow(el);
  el.style.opacity = '0';
  el.style.height = '0px';
  await waitForTransition(el, 'height', duration + 40);
  if (!isCurrentGeneration(el, g)) return;
  el.innerHTML = '';
  el.style.height = 'auto';
  // overflow stays 'hidden' permanently — see the note in crossfadeContent
  // below on why it's never reverted to visible.
  el.style.opacity = '1'; // reset so it's visible next time content fills it
  el.style.transition = ''; // fully idle now — nothing should still be "live"
}

// Fades `el`'s current content out, resizes it to fit `newHTML` WHILE STILL
// INVISIBLE, and only then fades the new content in. Resizing and fading in
// at the same time (the previous approach) meant shrinking to shorter
// content showed a blank gap below it until the height caught up, and
// growing to taller content could briefly clip it — sequencing so the box
// is already the right size before anything becomes visible avoids both.
async function crossfadeContent(el, newHTML) {
  if (!newHTML || !newHTML.trim()) { collapseElement(el, TUNING.collapse); return; }
  const g = bumpGeneration(el);

  lockHeight(el);
  el.style.transition = `opacity ${TUNING.fadeOut}ms ${TUNING.easeIn}`;
  forceReflow(el);
  el.style.opacity = '0';
  await waitForTransition(el, 'opacity', TUNING.fadeOut + 40);
  if (!isCurrentGeneration(el, g)) return;

  el.innerHTML = newHTML;
  // Wait a frame before measuring: right after an innerHTML swap, Tailwind's
  // CDN build injects CSS for any newly-used utility classes asynchronously
  // (via a MutationObserver), so scrollHeight read on the same tick can be
  // measured against not-yet-applied styles and land on the wrong target.
  await nextFrame();
  if (!isCurrentGeneration(el, g)) return;
  const endHeight = el.scrollHeight;
  await nextFrame();
  if (!isCurrentGeneration(el, g)) return;
  el.style.transition = `height ${TUNING.resize}ms ${TUNING.easeOut}`;
  forceReflow(el);
  el.style.height = endHeight + 'px';
  await waitForTransition(el, 'height', TUNING.resize + 40);
  if (!isCurrentGeneration(el, g)) return;
  el.style.height = 'auto';
  // overflow is left 'hidden' rather than reverted to visible/default: these
  // containers never legitimately need to show overflowing content once
  // settled, and repeatedly toggling overflow on/off around a border-radius
  // + animated-height element is what triggered a Safari-specific repaint
  // artifact (a stray shadow band bleeding into unrelated rows below,
  // appearing on scroll) — keeping it constant avoids the layer churn.

  // The box is now exactly the right size — safe to reveal the content.
  el.style.transition = `opacity ${TUNING.fadeIn}ms ${TUNING.easeOut}`;
  forceReflow(el);
  el.style.opacity = '1';
  await waitForTransition(el, 'opacity', TUNING.fadeIn + 40);
  if (!isCurrentGeneration(el, g)) return;
  el.style.transition = ''; // fully idle now — nothing should still be "live"
}

// bankselect <-> review share one shell (see subShellContent) — only the
// title and the body beneath it actually differ, so only those two animate.
// The back-chevron's target still needs updating, but instantly: it's the
// same glyph either way, there's nothing to visually transition.
function updateSubShell(step) {
  const backBtn = document.getElementById('subBack');
  const title = document.getElementById('subTitle');
  const body = document.getElementById('subBody');
  if (backBtn) backBtn.setAttribute('onclick', subShellBackOnclick(step));
  if (title) crossfadeContent(title, subShellTitle(step));
  if (body) crossfadeContent(body, subShellBody(step));
}

function updatePbbVariable(prevStep) {
  const box = document.getElementById('pbbBox');
  const btnRow = document.getElementById('pbbButtonRow');

  if (SUBSHELL_STEPS.has(prevStep) && SUBSHELL_STEPS.has(state.step)) {
    updateSubShell(state.step);
  } else {
    // No shared structure between these two steps — fall back to fading the
    // whole box out and back in (or, if closing to nothing, the fast
    // combined collapse above).
    crossfadeContent(box, pbbBoxContent(state.step));
  }

  if (btnRow) crossfadeContent(btnRow, pbbButtonContent(state.step));

// ---------------------------------------------------------------------------
// Navigation / transition engine
// ---------------------------------------------------------------------------
function buildScreenHTML(step) {
  const g = groupOf(step);
  if (g === 'A') return buildGroupA(step);
  if (g === 'B') return buildGroupB();
  if (g === 'C') return buildGroupC(step);
  return buildGroupD();
}

function renderTransition(prevStep) {
  const phone = document.getElementById('phone');
  const newGroup = groupOf(state.step);

  if (newGroup === mountedGroup && newGroup === 'A') { updatePbbVariable(prevStep); return; }
  if (newGroup === mountedGroup && newGroup === 'C') { updateOverlayC(); return; }

  // Crossing groups (or first load): these layouts share nothing, so fade
  // the old screen out COMPLETELY before mounting the new one — sequential,
  // not overlapping. Fading them simultaneously (as before) briefly showed
  // both blended together — e.g. a light card layout ghosted under a dark
  // full-bleed Face ID screen — which read as the whole section flashing/
  // shifting rather than a clean transition.
  const old = phone.firstElementChild;
  mountedGroup = newGroup;

  const mountNext = () => {
    phone.style.background = stepBackground(state.step);
    const temp = document.createElement('div');
    temp.innerHTML = buildScreenHTML(state.step);
    const next = temp.firstElementChild;
    next.style.opacity = '0';
    phone.appendChild(next);
    phone.scrollTop = 0;
    requestAnimationFrame(() => {
      next.style.transition = `opacity ${TUNING.screenFadeIn}ms ${TUNING.easeOut}`;
      next.style.opacity = '1';
      // `next` is long-lived (the whole time the user's on this screen) —
      // leaving `transition` set after it settles risks the same stray
      // repaint artifacts a lingering transition caused elsewhere (see
      // crossfadeContent/collapseElement).
      waitForTransition(next, 'opacity', TUNING.screenFadeIn + 40).then(() => {
        next.style.transition = '';
      });
    });
  };

  if (old) {
    old.style.transition = `opacity ${TUNING.screenFadeOut}ms ${TUNING.easeIn}`;
    old.style.opacity = '0';
    setTimeout(() => { old.remove(); mountNext(); }, TUNING.screenFadeOut);
  } else {
    mountNext();
  }
}

function goto(step) {
  if (step === state.step) return; // already there — nothing to transition
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const prevStep = state.step;
  state.step = step;
  renderTransition(prevStep);
  if (step === 'login') autoTimer = setTimeout(() => goto('bankreview'), TUNING.autoAdvance);
  if (step === 'bankauth') autoTimer = setTimeout(() => goto('success'), TUNING.autoAdvance);
}

// Desktop-only "scan to pay" modal — on the web there's no single phone app
// to redirect to, so instead of mobile's redirect+bank-hosted-page flow,
// paying opens a QR code you'd scan with your banking app. Clicking the QR
// itself simulates that scan (there's no real phone camera here to trigger
// it) and shows a brief loading state before landing on success.
// ---------------------------------------------------------------------------
function fakeQrSvg() {
  const N = 21, cell = 8, size = N * cell; // a plausible QR module grid, not a real scannable code
  const finders = [[0, 0], [N - 7, 0], [0, N - 7]];
  const c0 = Math.floor(N / 2) - 2, c1 = c0 + 5; // blank center reserved for the bank logo overlay
  const inFinder = (x, y) => finders.some(([fx, fy]) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7);
  const inCenter = (x, y) => x >= c0 && x < c1 && y >= c0 && y < c1;
  let modules = '';
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (inFinder(x, y) || inCenter(x, y)) continue;
      if (Math.random() < 0.42) modules += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}" fill="#1f1f25"/>`;
    }
  }
  const finderSvg = (fx, fy) => {
    const X = fx * cell, Y = fy * cell, S = 7 * cell;
    return `<rect x="${X}" y="${Y}" width="${S}" height="${S}" fill="#1f1f25"/>
      <rect x="${X + cell}" y="${Y + cell}" width="${S - 2 * cell}" height="${S - 2 * cell}" fill="#ffffff"/>
      <rect x="${X + 2 * cell}" y="${Y + 2 * cell}" width="${S - 4 * cell}" height="${S - 4 * cell}" fill="#1f1f25"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size}" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
      <rect width="${size}" height="${size}" fill="#ffffff"/>
      ${finders.map(([fx, fy]) => finderSvg(fx, fy)).join('')}
      ${modules}
    </svg>`;
}

// Full-page swap for #desktopStage — the desktop equivalent of mobile's
// renderTransition() "crossing groups" branch: fades the old page out
// completely, then fades the new one in (same TUNING.screenFadeOut/In
// values), rather than overlapping the two or swapping instantly. Only
// called when the *page* itself changes (checkout -> redirecting ->
// bankconfirm -> success); in-place step changes within the checkout page
// go through dtUpdatePbbVariable instead, exactly like mobile never
// remounts buildGroupA just to move between its own steps.
function dtRenderTransition() {
  const container = document.getElementById('desktopStage');
  const old = container.firstElementChild;
  dtMountedPage = dtState.stage;

  const mountNext = () => {
    const temp = document.createElement('div');
    temp.innerHTML = dtBuildPageHTML(dtState.stage);
    const next = temp.firstElementChild;
    next.style.opacity = '0';
    container.appendChild(next);
    requestAnimationFrame(() => {
      next.style.transition = `opacity ${TUNING.screenFadeIn}ms ${TUNING.easeOut}`;
      next.style.opacity = '1';
      waitForTransition(next, 'opacity', TUNING.screenFadeIn + 40).then(() => {
        next.style.transition = '';
      });
    });
  };

  if (old) {
    old.style.transition = `opacity ${TUNING.screenFadeOut}ms ${TUNING.easeIn}`;
    old.style.opacity = '0';
    setTimeout(() => { old.remove(); mountNext(); }, TUNING.screenFadeOut);
  } else {
    mountNext();
  }
}

// Mounts the checkout page the first time desktop mode is entered. Later
// toggles between mobile/desktop just show/hide #desktopStage via CSS (see
// #stage.mode-* rules) — its DOM persists, so this never re-fires and never
// interrupts an in-progress selection.
function dtEnsureMounted() {
  if (dtMountedPage === null) dtRenderTransition();
}

// Radio state (Pay by Bank / Card / PayPal) is shared, static markup across
// every checkout-page step — updating it is an instant swap, mirroring

function dtUpdateSubShell(step) {
  const backBtn = document.getElementById('dtSubBack');
  const title = document.getElementById('dtSubTitle');
  const body = document.getElementById('dtSubBody');
  if (backBtn) backBtn.setAttribute('onclick', dtSubShellBackOnclick(step));

}

// Mirrors mobile's updatePbbVariable() — patches only the parts of the
// checkout page that actually differ between two group-A-equivalent steps,
// using the exact same crossfadeContent/collapseElement animation engine
// (and TUNING values) as mobile, instead of a full re-render.
function dtUpdatePbbVariable(prevStep) {
  const box = document.getElementById('dtPbbBox');
  const btnRow = document.getElementById('dtPbbButtonRow');
  if (!box) return;

  if (SUBSHELL_STEPS.has(prevStep) && SUBSHELL_STEPS.has(dtState.step)) {
    dtUpdateSubShell(dtState.step);
  } else {
    crossfadeContent(box, dtPbbBoxContent());
  }

  if (btnRow) crossfadeContent(btnRow, dtPbbButtonContent());
}

  if (step === dtState.step) return;
  const prevStep = dtState.step;
  dtState.step = step;
  dtUpdatePbbVariable(prevStep);
}

function dtChoosePayByBank() {

function dtSelectBank(id) { dtState.selectedBank = id; dtGoto('review'); }

function dtBackToBankSelect() {

function dtPay() {

function dtResetFlow() {

  dtState.stage = 'checkout';

// ---------------------------------------------------------------------------
// View mode — responsive by default (desktop checkout above the breakpoint,
// the phone-framed mobile flow below it), with a manual override button.
// `viewModeOverride` is null while following the viewport; once toggled, it
// sticks with whatever was chosen regardless of resizing.
// ---------------------------------------------------------------------------
const desktopBreakpoint = window.matchMedia('(min-width: 900px)');
let viewModeOverride = null;

function effectiveViewMode() {
  return viewModeOverride || (desktopBreakpoint.matches ? 'desktop' : 'mobile');
}

function applyViewMode() {
  const mode = effectiveViewMode();
  document.getElementById('stage').className = `mode-${mode} flex-1 w-full flex items-center justify-center`;
  const label = document.getElementById('viewModeLabel');
  const icon = document.querySelector('#viewModeToggle i');
  const body = document.getElementById('pageBody');
  if (mode === 'desktop') {
    label.textContent = 'Switch to mobile';
    icon.className = 'fa-solid fa-mobile-screen-button';
    body.classList.remove('bg-[#eef0f3]');
    body.classList.add('bg-white');
    dtEnsureMounted();
  } else {
    label.textContent = 'Switch to desktop';
    icon.className = 'fa-solid fa-desktop';
    body.classList.remove('bg-white');
    body.classList.add('bg-[#eef0f3]');
  }
}

// Toggling to whichever mode the viewport would already pick on its own
// clears the override back to null (auto) instead of pinning it — otherwise
// switching to mobile and back to desktop on a wide window left
// viewModeOverride stuck at 'desktop' forever, silently disabling the
// automatic switch on every resize after that point.
function toggleViewMode() {
  const target = effectiveViewMode() === 'desktop' ? 'mobile' : 'desktop';
  const natural = desktopBreakpoint.matches ? 'desktop' : 'mobile';
  viewModeOverride = target === natural ? null : target;
  applyViewMode();
}

desktopBreakpoint.addEventListener('change', () => {
  if (viewModeOverride === null) applyViewMode();
});

// ---------------------------------------------------------------------------
// Animation tuner — a small on-page panel for live-adjusting every duration/
// easing in TUNING. Every animation function above reads TUNING fresh each
// time it runs, so a slider change takes effect on the very next transition
// — no reload needed.
// ---------------------------------------------------------------------------
const TUNER_FIELDS = [
  { key: 'fadeOut', label: 'Fade out', min: 0, max: 400, step: 10 },
  { key: 'resize', label: 'Resize (invisible)', min: 0, max: 500, step: 10 },
  { key: 'fadeIn', label: 'Fade in', min: 0, max: 400, step: 10 },
  { key: 'collapse', label: 'Collapse to empty', min: 0, max: 500, step: 10 },
  { key: 'screenFadeOut', label: 'Screen fade out', min: 0, max: 500, step: 10 },
  { key: 'screenFadeIn', label: 'Screen fade in', min: 0, max: 500, step: 10 },
  { key: 'overlaySlide', label: 'Face ID slide-in', min: 0, max: 1000, step: 10 },
  { key: 'autoAdvance', label: 'Auto-advance delay', min: 500, max: 4000, step: 100 },
];
const TUNER_EASE_OPTIONS = [
  ['ease', 'Ease'],
  ['ease-in', 'Ease in'],
  ['ease-out', 'Ease out'],
  ['ease-in-out', 'Ease in-out'],
  ['linear', 'Linear'],
  ['cubic-bezier(.22,1,.36,1)', 'Snappy (expo out)'],
  ['cubic-bezier(.4,0,.2,1)', 'Material standard'],
];

function buildTunerPanel() {
  const sliderRow = (f) => `
    <label class="flex flex-col gap-1 text-xs text-[#1f1f25]">
      <span class="flex justify-between items-center">
        <span>${f.label}</span>
        <span id="tuner-val-${f.key}" class="font-mono text-[11px] text-[#4d3bd8]">${TUNING[f.key]}ms</span>
      </span>
      <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${TUNING[f.key]}"
        oninput="setTuningNumber('${f.key}', this.value)" class="w-full accent-[#4d3bd8]" />
    </label>`;

  const easeSelect = (key, label) => `
    <label class="flex flex-col gap-1 text-xs text-[#1f1f25]">
      <span>${label}</span>
      <select onchange="setTuningValue('${key}', this.value)" class="w-full text-xs border border-[#d0d0d7] rounded-md px-2 py-1.5 bg-white">
        ${TUNER_EASE_OPTIONS.map(([v, l]) => `<option value="${v}" ${TUNING[key] === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </label>`;

  return `
    <div class="flex items-center justify-between mb-3">
      <p class="text-sm font-semibold text-[#1f1f25]">Animation tuner</p>
      <button onclick="toggleTuner()" class="w-6 h-6 flex items-center justify-center rounded-md hover:bg-[#f4f4f6] text-[#646477]"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="flex flex-col gap-3">${TUNER_FIELDS.map(sliderRow).join('')}</div>
    <div class="grid grid-cols-2 gap-2 mt-3">${easeSelect('easeOut', 'Ease (entrances)')}${easeSelect('easeIn', 'Ease (exits)')}</div>
    <button onclick="previewTuning()" class="w-full mt-3 text-xs font-semibold text-white bg-[#4d3bd8] rounded-lg py-2 hover:brightness-95 transition">▶ Preview transitions</button>
    <div class="flex gap-2 mt-2">
      <button onclick="resetTuning()" class="flex-1 text-xs font-semibold border border-[#d0d0d7] rounded-lg py-2 hover:bg-[#f4f4f6] transition">Reset</button>
      <button id="tunerCopyBtn" onclick="copyTuningCode(this)" class="flex-1 text-xs font-semibold border border-[#d0d0d7] rounded-lg py-2 hover:bg-[#f4f4f6] transition">Copy code</button>
    </div>`;
}

function refreshTunerPanel() {
  const panel = document.getElementById('tunerPanel');
  if (panel && !panel.classList.contains('hidden')) panel.innerHTML = buildTunerPanel();
}

function setTuningNumber(key, rawValue) {
  TUNING[key] = Number(rawValue);
  const readout = document.getElementById(`tuner-val-${key}`);
  if (readout) readout.textContent = `${TUNING[key]}ms`;
}

function setTuningValue(key, value) {
  TUNING[key] = value;
}

function toggleTuner() {
  const panel = document.getElementById('tunerPanel');
  const isHidden = panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !isHidden);
  if (isHidden) panel.innerHTML = buildTunerPanel();
}

function resetTuning() {
  Object.assign(TUNING, TUNING_DEFAULTS);
  refreshTunerPanel();
}

function copyTuningCode(btn) {
  const body = Object.keys(TUNING_DEFAULTS)
    .map((k) => `  ${k}: ${typeof TUNING[k] === 'string' ? `'${TUNING[k]}'` : TUNING[k]},`)
    .join('\n');
  const code = `const TUNING = {\n${body}\n};`;
  const showCopied = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(showCopied).catch(() => alert(code));
  } else {
    alert(code);
  }
}

// Runs the pbb-box grow, sub-shell swap, sub-shell shrink, and full-collapse
// transitions back to back so a tuned value can be seen immediately without
// manually clicking through the whole flow.
async function previewTuning() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const pbbSettle = () => TUNING.fadeOut + TUNING.resize + TUNING.fadeIn + 150;
  const screenSettle = () => TUNING.screenFadeOut + TUNING.screenFadeIn + 150;

  resetFlow();
  await wait(screenSettle());
  choosePayByBank();
  await wait(pbbSettle());
  goto('bankselect');
  await wait(pbbSettle());
  selectBank('monzo');
  await wait(pbbSettle());
  backToBankSelect();
  await wait(pbbSettle());
  selectMethod('card');
}

(function initFromQuery() {
  const params = new URLSearchParams(location.search);
  const q = params.get('step');
  const validSteps = ['method', 'pbb', 'bankselect', 'review', 'login', 'bankreview', 'bankauth', 'success'];
  if (q && validSteps.includes(q)) state.step = q;

  // The animation tuner is a dev/demo-building tool, not part of the demo
  // itself — only surface its toggle when explicitly requested via ?tuner.
  if (params.has('tuner')) document.getElementById('tunerToggle').classList.remove('hidden');

  const view = params.get('view');
  if (view === 'mobile' || view === 'desktop') viewModeOverride = view;
})();
renderTransition();
applyViewMode();

// Press "R" to restart the demo — plain keypress only, so Cmd/Ctrl+R still
// reloads the page as usual instead of being hijacked.
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() !== 'r') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  resetFlow();
});
</script>
